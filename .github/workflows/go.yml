name: Go

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.22

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...
      env:
        TWIKEY_API_KEY: ${{ secrets.TWIKEY_API_KEY }}
        CT: ${{ secrets.CT }}
        MNDTNUMBER: ${{ secrets.MNDTNUMBER }}
